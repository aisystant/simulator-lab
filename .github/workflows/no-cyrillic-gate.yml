name: No-Cyrillic Gate

on:
  push:
  pull_request:

jobs:
  no-cyrillic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: range
        # pull_request has a well-defined base/head. For push, the event's
        # "before" is unusable as a base: it is all-zero on a new branch
        # (falling back to the repo's root commit would diff the entire
        # history, catching every pre-existing Cyrillic file) and can point
        # at a commit this fetch no longer has after a force-push/amend
        # (git diff/log would fail with "bad object"). The new commit's own
        # parent answers "what did this push actually add" in every case.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            head="${{ github.event.after }}"
            base="$(git rev-parse -q --verify "${head}^" || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Cyrillic gate — new lines introduced by this change
        # Scoped to the diff, not the whole tree: these repositories carry
        # pre-existing Cyrillic (legacy comments/docs); the gate blocks new
        # drift going forward, not retroactive cleanup nobody asked for.
        # The range is written as a hex Unicode escape, not literal Cyrillic
        # letters, so the gate's own source file never trips its own check.
        run: |
          base="${{ steps.range.outputs.base }}"
          head="${{ steps.range.outputs.head }}"
          added=$(git diff "$base" "$head" -- . | grep -P '^\+[^+]' | grep -P '[\x{0400}-\x{04FF}\x{0500}-\x{052F}]' || true)
          if [ -n "$added" ]; then
            echo '::error::New Cyrillic text introduced by this change -- this repository is English-only going forward.'
            printf '%s\n' "$added"
            exit 1
          fi
          echo 'PASS: no new Cyrillic introduced.'

      - name: Cyrillic gate — commit messages
        # Checks only the pushed commit's own message, not a base..head range:
        # base can be the empty-tree sentinel (a tree, not a commit), which a
        # commit range cannot use.
        run: |
          head="${{ steps.range.outputs.head }}"
          messages="$(git log -1 --format=%B "$head")"
          if printf '%s' "$messages" | grep -qP '[\x{0400}-\x{04FF}\x{0500}-\x{052F}]'; then
            echo '::error::Commit message contains Cyrillic -- this repository is English-only going forward.'
            exit 1
          fi
          echo 'PASS: commit messages contain no Cyrillic.'
